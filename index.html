<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akshay S Dev — Digital Designer</title>
  <meta name="description" content="Graphic & visual designer portfolio. Experiments first. Ego later.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <header class="site-header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" data-config="nav.logo">Akshay S Dev</a>
      <nav class="nav" aria-label="Main navigation">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>
  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

  <!-- Hero -->
  <section class="hero section" id="hero">
    <div class="hero-watermark" id="hero-watermark" aria-hidden="true">動</div>
    <div class="container hero-inner">
      <div class="hero-content reveal">
        <div class="hero-avatar">
          <div class="avatar-frame">
            <img src="assets/avatar.svg" alt="Akshay S Dev" id="hero-avatar" width="120" height="120">
          </div>
        </div>
        <h1 class="hero-name" data-config="hero.name">Akshay S Dev</h1>
        <p class="hero-role" data-config="hero.role">Digital Designer</p>
        <hr class="hero-divider">
        <p class="hero-tagline" data-config="hero.tagline"></p>
      </div>
    </div>
  </section>

  <!-- Works -->
  <section class="works section section--gray" id="works">
    <div class="container">
      <div class="section-header reveal">
        <h2 class="section-title" data-config="works.title">Works</h2>
        <p class="section-desc" data-config="works.description"></p>
      </div>
      <div class="works-grid" id="works-grid"></div>
    </div>
  </section>

  <!-- Testimonials -->
  <section class="testimonials section" id="testimonials">
    <div class="container">
      <div class="section-header section-header--lined reveal">
        <h2 class="section-title" data-config="testimonials.title">Testimonials</h2>
        <p class="section-desc" data-config="testimonials.description"></p>
      </div>
      <div class="testimonials-layout reveal">
        <div class="testimonial-slider" id="testimonial-slider">
          <div class="testimonial-track" id="testimonial-track"></div>
          <div class="testimonial-nav">
            <button class="testimonial-btn" id="testimonial-prev" aria-label="Previous testimonial">←</button>
            <div class="testimonial-dots" id="testimonial-dots"></div>
            <button class="testimonial-btn" id="testimonial-next" aria-label="Next testimonial">→</button>
          </div>
        </div>
        <div class="testimonial-accent" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- Brands -->
  <section class="brands section section--gray" id="brands">
    <div class="container">
      <div class="section-header section-header--lined reveal">
        <h2 class="section-title" data-config="brands.title">Brands</h2>
        <p class="section-desc" data-config="brands.description"></p>
      </div>
      <div class="brands-banner reveal" id="brands-banner"></div>
    </div>
  </section>

  <!-- Software & Skills -->
  <section class="skills section section--dark" id="skills">
    <div class="container">
      <div class="section-header section-header--lined section-header--dark reveal">
        <h2 class="section-title" data-config="skills.title">Software & Skills</h2>
        <p class="section-desc" data-config="skills.description"></p>
      </div>
      <div class="skills-card reveal">
        <div class="skills-headline" data-config="skills.headline"></div>
        <div class="skills-tools" id="skills-tools"></div>
        <div class="skills-tags" id="skills-tags"></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer section" id="contact">
    <div class="container">
      <div class="footer-top reveal">
        <p class="footer-cta" data-config="footer.cta"></p>
        <div class="footer-links" id="footer-links"></div>
      </div>
      <p class="footer-motto reveal" data-config="footer.motto">Experiments first. Ego later.</p>
      <h2 class="footer-name reveal" data-config="footer.name">Akshay S Dev</h2>
      <div class="footer-bottom reveal">
        <hr>
        <p class="footer-copy" id="footer-copy"></p>
      </div>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">×</button>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

  <!-- Theme Customizer -->
  <button class="customizer-toggle" id="customizer-toggle" aria-label="Open theme customizer" title="Customize theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>
  <aside class="customizer" id="customizer" aria-hidden="true">
    <div class="customizer-header">
      <h3>Customize</h3>
      <button class="customizer-close" id="customizer-close" aria-label="Close">×</button>
    </div>
    <div class="customizer-body">
      <div class="customizer-group">
        <label for="accent-color">Accent Color</label>
        <input type="color" id="accent-color" value="#E8341A">
      </div>
      <div class="customizer-group">
        <label for="bg-primary">Background</label>
        <input type="color" id="bg-primary" value="#FFFFFF">
      </div>
      <div class="customizer-group">
        <label for="bg-secondary">Section Gray</label>
        <input type="color" id="bg-secondary" value="#F2F2F2">
      </div>
      <div class="customizer-group">
        <label for="text-primary">Text Color</label>
        <input type="color" id="text-primary" value="#1A1A1A">
      </div>
      <div class="customizer-group">
        <label for="heading-font">Heading Font</label>
        <select id="heading-font">
          <option value="'Cormorant Garamond', Georgia, serif">Cormorant Garamond</option>
          <option value="'Playfair Display', Georgia, serif">Playfair Display</option>
          <option value="'Libre Baskerville', Georgia, serif">Libre Baskerville</option>
          <option value="'DM Serif Display', Georgia, serif">DM Serif Display</option>
        </select>
      </div>
      <div class="customizer-group">
        <label for="animation-toggle">Animations</label>
        <input type="checkbox" id="animation-toggle" checked>
      </div>
      <button class="customizer-reset" id="customizer-reset">Reset to defaults</button>
    </div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
